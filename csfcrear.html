<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORRES PRO Intel | Dashboard Final 2026</title>
    
    <!-- 1. Carga de Supabase y cliente centralizado -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabaseClient.js"></script>

    <!-- 2. Librerías externas -->
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://unpkg.com/docxtemplater@3.37.2/build/docxtemplater.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #0b0f1a; --panel: #161e2d; --accent: #00f2fe; --green: #10b981;
            --text: #f8fafc; --dim: #94a3b8; --border: rgba(255,255,255,0.08);
            --status-pending: #f59e0b; --status-done: #10b981;
            --bg-card-gradient: linear-gradient(145deg, #161e2d 0%, #1c2539 100%);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text); margin: 0; padding: 25px;
            background-image: radial-gradient(circle at top right, #1e293b, #0b0f1a);
            min-height: 100vh;
        }

        .glass-header {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(22, 30, 45, 0.7); backdrop-filter: blur(10px);
            padding: 20px 30px; border-radius: 20px; border: 1px solid var(--border);
            margin-bottom: 20px; position: sticky; top: 10px; z-index: 100;
        }

        .search-input {
            width: 350px; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            padding: 10px 15px; border-radius: 12px; color: white; outline: none;
        }

        .btn-action {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer;
            font-weight: 700; font-size: 0.65rem; transition: 0.3s; text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px; justify-content: center;
        }

        .btn-neon-green:hover {
            background: var(--green) !important; color: #000 !important;
            box-shadow: 0 0 15px var(--green); transform: translateY(-2px);
        }

        .score-container { display: flex; gap: 8px; margin: 10px 0; }
        .score-pill {
            flex: 1; padding: 6px; border-radius: 8px; font-size: 0.65rem;
            text-align: center; font-weight: 800; border: 1px solid rgba(255,255,255,0.05);
        }
        .score-solicitud { background: rgba(245, 158, 11, 0.1); color: var(--status-pending); border-color: var(--status-pending); }
        .score-respuesta { background: rgba(16, 185, 129, 0.1); color: var(--status-done); border-color: var(--status-done); }
        .download-date { font-size: 0.55rem; display: block; margin-top: 4px; color: var(--dim); font-weight: normal; font-family: monospace; }

        .filter-console {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; background: rgba(255, 255, 255, 0.03);
            padding: 15px 25px; border-radius: 15px; border: 1px solid var(--border);
        }

        .filter-btn {
            background: transparent; border: 1px solid var(--border); color: var(--dim);
            padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: 600;
        }
        .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        .group-section { background: rgba(255, 255, 255, 0.02); padding: 25px; border-radius: 24px; border: 1px solid var(--border); margin-bottom: 50px; }
        .group-label { font-size: 0.9rem; font-weight: 700; color: var(--accent); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 25px; overflow: hidden; display: flex; }
        .progress-fill { height: 100%; transition: 0.5s; }

        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
        
        .tech-card {
            background: var(--bg-card-gradient); border-radius: 20px; padding: 22px;
            border: 1px solid var(--border); position: relative; transition: 0.4s;
            display: flex; flex-direction: column; gap: 10px; border-left: 4px solid var(--dim);
        }

        .tech-card.completed { border-left-color: var(--status-done); }
        .tech-card.pending { border-left-color: var(--status-pending); }

        .ofa-salida-tag { font-size: 0.7rem; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
        .tag-pending { background: rgba(245, 158, 11, 0.1); color: var(--status-pending); border: 1px solid var(--status-pending); }
        .tag-done { background: rgba(16, 185, 129, 0.1); color: var(--status-done); border: 1px solid var(--status-done); }

        .data-label { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
        .data-value { font-size: 0.85rem; font-weight: 500; display: block; }
        
        #toast-container { position: fixed; top: 25px; right: 25px; z-index: 9999; }
        .toast {
            background: rgba(22, 30, 45, 0.95); border-left: 4px solid var(--accent); color: white;
            padding: 16px 24px; border-radius: 12px; display: flex; align-items: center; gap: 15px;
            margin-bottom: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            transform: translateX(120%); transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast.show { transform: translateX(0); }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div class="glass-header">
    <div>
        <h1 style="margin:0; font-size:1.6rem">📄CORRES PRO <span style="font-weight:100">DASHBOARD</span></h1>
        <p style="margin:0; font-size:0.7rem; color:var(--dim)">SISTEMA DE CONSULTA E HISTORIAL DE DESCARGAS</p>
    </div>
    <input type="text" id="mainSearch" class="search-input" placeholder="Buscar por nombre, entidad o folio..." onkeyup="busquedaReal()">
    <div style="display:flex; gap:10px">
        <a href="menu.html" class="btn-action"><i class="fas fa-th-large"></i> MENÚ</a>
        <a href="crearcsf.html" class="btn-action"><i class="fas fa-arrow-left"></i> REGRESAR</a>
        <button onclick="exportarExcel()" class="btn-action" style="background:#1d6f42"><i class="fas fa-file-excel"></i> REPORTE TOTAL</button>
    </div>
</div>

<div class="filter-console">
    <div style="display: flex; gap: 12px;">
        <button class="filter-btn active" onclick="filtrarVista('todos', this)">VISTA TOTAL <span id="count-todos">0</span></button>
        <button class="filter-btn" onclick="filtrarVista('pendientes', this)">PENDIENTES <span id="count-pendientes">0</span></button>
    </div>

    <div id="mini-stats" style="display: flex; gap: 20px; padding: 0 20px; border-left: 1px solid var(--border);">
        <div style="text-align: center;">
            <span style="display: block; font-size: 0.6rem; color: var(--status-pending); font-weight: bold; text-transform: uppercase;">Solicitudes</span>
            <span id="stat-solicitudes" style="font-size: 1.2rem; font-weight: 800; color: var(--text);">0</span>
        </div>
        <div style="text-align: center;">
            <span style="display: block; font-size: 0.6rem; color: var(--status-done); font-weight: bold; text-transform: uppercase;">Respuestas</span>
            <span id="stat-respuestas" style="font-size: 1.2rem; font-weight: 800; color: var(--text);">0</span>
        </div>
    </div>
</div>

<div id="main-view"></div>

<script>
    let datosLocales = [];
    let filtroActual = 'todos';
    const historialDescargas = {};

    async function init() {
        if (typeof _supabase === 'undefined') {
            console.error("El cliente _supabase no está disponible.");
            return;
        }

        const { data, error } = await _supabase.from('ofassalida').select('*');
        if (error) {
            console.error("Error al obtener datos:", error);
            return;
        }
        datosLocales = data.sort((a, b) => (b.csf_salida || 0) - (a.csf_salida || 0));
        actualizarContadores();
        aplicarRender();
    }

    function mostrarNotificacion(titulo, mensaje) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<div><strong>${titulo}</strong><br><small>${mensaje}</small></div>`;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 100);
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 3500);
    }

    function actualizarContadores() {
        const totalRegistros = datosLocales.length;
        const pendientes = datosLocales.filter(r => !r["OFA Salida"] || r["OFA Salida"] === 'Pendiente').length;
        
        const totalSolicitudes = datosLocales.filter(r => r["OFA Entrada"] && r["OFA Entrada"] !== '---').length;
        const totalRespuestas = datosLocales.filter(r => r["OFA Salida"] && r["OFA Salida"] !== 'Pendiente' && r["OFA Salida"] !== '').length;

        document.getElementById('count-todos').innerText = totalRegistros;
        document.getElementById('count-pendientes').innerText = pendientes;
        document.getElementById('stat-solicitudes').innerText = totalSolicitudes;
        document.getElementById('stat-respuestas').innerText = totalRespuestas;
    }

    function filtrarVista(tipo, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtroActual = tipo;
        aplicarRender();
    }

    function busquedaReal() {
        const q = document.getElementById('mainSearch').value.toLowerCase();
        document.querySelectorAll('.tech-card').forEach(c => {
            c.style.display = c.getAttribute('data-index').includes(q) ? 'flex' : 'none';
        });
    }

    function aplicarRender() {
        const view = document.getElementById('main-view');
        view.innerHTML = '';
        
        let filtrados = filtroActual === 'pendientes' ? datosLocales.filter(r => !r["OFA Salida"] || r["OFA Salida"] === 'Pendiente') : datosLocales;
        const grupos = filtrados.reduce((acc, obj) => {
            const key = obj["OFA Entrada"] || "ORIGEN NO DEFINIDO";
            if (!acc[key]) acc[key] = [];
            acc[key].push(obj);
            return acc;
        }, {});

        for (const [entrada, folios] of Object.entries(grupos)) {
            const atendidos = folios.filter(f => f["OFA Salida"] && f["OFA Salida"] !== 'Pendiente').length;
            const porc = (atendidos / folios.length) * 100;
            const colorP = porc === 100 ? 'var(--status-done)' : 'var(--status-pending)';

            const section = document.createElement('div');
            section.className = 'group-section';
            section.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <div class="group-label"><i class="fas fa-folder-open"></i> ENTRADA: ${entrada}</div>
                    <span style="font-size:0.7rem; color:${colorP}; font-weight:bold">${atendidos}/${folios.length} PROCESADOS</span>
                </div>
                <div class="progress-container"><div class="progress-fill" style="width:${porc}%; background:${colorP}"></div></div>
                <div class="grid-layout">
                    ${folios.map(r => {
                        const isDone = r["OFA Salida"] && r["OFA Salida"] !== 'Pendiente';
                        const fechaSol = historialDescargas[`${r.id}_solicitud`] || "Nunca descargado";
                        const fechaRes = historialDescargas[`${r.id}_respuesta`] || "Nunca descargado";

                        return `
                        <div class="tech-card ${isDone ? 'completed' : 'pending'}" data-index="${(r.dirigido_a + r.dep_dirigi + r.csf_salida).toLowerCase()}">
                            
                            <div style="display:flex; justify-content:space-between; align-items:center">
                                <span class="data-label" style="color:var(--accent); font-weight:bold">FOLIO: CSF/${r.csf_salida}/2026</span>
                                <div class="ofa-salida-tag ${isDone ? 'tag-done' : 'tag-pending'}">${r["OFA Salida"] || 'PENDIENTE'}</div>
                            </div>

                            <div class="score-container">
                                <div class="score-pill score-solicitud">
                                    <i class="fas fa-file-invoice"></i> SOLICITUD
                                    <span class="download-date" id="date-${r.id}-sol">${fechaSol}</span>
                                </div>
                                <div class="score-pill score-respuesta">
                                    <i class="fas fa-reply-all"></i> RESPUESTA
                                    <span class="download-date" id="date-${r.id}-res">${fechaRes}</span>
                                </div>
                            </div>

                            <div>
                                <span class="data-label">Destinatario</span>
                                <span class="data-value">${r.dirigido_a || '---'}</span>
                            </div>

                            <div>
                                <span class="data-label">Entidad / Dependencia</span>
                                <span class="data-value" style="color:var(--dim)">${r.dep_dirigi || '---'}</span>
                            </div>

                            <div>
                                <span class="data-label">Oficio Emisor</span>
                                <span class="data-value" style="color:var(--accent); font-weight:bold;">${r.oficio_emisor || '---'}</span>
                            </div>

                            <div>
                                <span class="data-label">Firmante</span>
                                <span class="data-value" style="color:var(--accent); font-weight:bold;">${r.firmante || '---'}</span>
                            </div>

                            <div style="background:rgba(0,0,0,0.2); padding:8px; border-radius:8px; font-size:0.75rem; color:var(--dim); min-height:40px">
                                ${r.asunto || 'Sin asunto registrado...'}
                            </div>

                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:5px">
                                <button class="btn-action btn-neon-green" onclick="down('${r.id}', 'solicitud')">
                                    <i class="fas fa-download"></i> SOLICITUD
                                </button>
                                <button class="btn-action btn-neon-green" onclick="down('${r.id}', 'respuesta')">
                                    <i class="fas fa-download"></i> RESPUESTA
                                </button>
                            </div>
                        </div>`;
                    }).join('')}
                </div>`;
            view.appendChild(section);
        }
    }

    async function down(id, tipo) {
        mostrarNotificacion('PROCESANDO', 'Generando documento oficial...');
        try {
            const { data: r } = await _supabase.from('ofassalida').select('*').eq('id', id).single();
            const url = tipo === 'solicitud' 
                ? "https://ltxluqwvspkwnzodgwim.supabase.co/storage/v1/object/public/Plantilla%20solicitud/CSF-0000-2026-solicitud.docx" 
                : "https://ltxluqwvspkwnzodgwim.supabase.co/storage/v1/object/public/plantilla%20respuesta/CSF-0000-2026-respuesta.docx";
            
            const res = await fetch(url);
            const buf = await res.arrayBuffer();
            const doc = new window.docxtemplater(new window.PizZip(buf), { paragraphLoop: true, linebreaks: true });
            
            const fechaActual = new Date().toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            
            doc.setData({
                ...r, 
                fecha: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })
            });
            
            doc.render();
            saveAs(doc.getZip().generate({ type: "blob" }), `${tipo.toUpperCase()}_${r.csf_salida}.docx`);
            
            historialDescargas[`${id}_${tipo}`] = fechaActual;
            const elementId = `date-${id}-${tipo === 'solicitud' ? 'sol' : 'res'}`;
            if(document.getElementById(elementId)) document.getElementById(elementId).innerText = fechaActual;

            mostrarNotificacion('DESCARGA EXITOSA', `Documento generado el ${fechaActual}`);
        } catch(e) { 
            console.error(e);
            mostrarNotificacion('ERROR', 'No se pudo generar el archivo.'); 
        }
    }

    function exportarExcel() {
        const dataExcel = datosLocales.map(r => ({
            "Folio Interno": `CSF/${r.csf_salida}/2026`,
            "E-OFA": r["OFA Entrada"] || "---",
            "S-OFA": r["OFA Salida"] || "Pendiente",
            "Destinatario": r.dirigido_a || "---",
            "Firmante": r.firmante || "---"
        }));
        const ws = XLSX.utils.json_to_sheet(dataExcel);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Correspondencia_2026");
        XLSX.writeFile(wb, "REPORTE_CORRES_PRO_2026.xlsx");
        mostrarNotificacion('REPORTE EXCEL', 'El archivo se ha generado con éxito.');
    }

    init();
</script>

<footer style="text-align: center; padding: 40px; font-size: 0.7rem; color: var(--dim); border-top: 1px solid var(--border); margin-top: 20px;">
    <p>Desarrollado por <strong>🐤YEPRI-INN</strong> | Dashboard CORRES PRO | &copy; 2026</p>
</footer>

</body>
</html>
