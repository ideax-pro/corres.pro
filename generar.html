<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORRES PRO Intel | Diseñador de Plantillas</title>
    
    <!-- Supabase y Librerías -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabaseClient.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #0b0f1a; --panel: #161e2d; --accent: #00f2fe; --green: #10b981;
            --text: #f8fafc; --dim: #94a3b8; --border: rgba(255,255,255,0.08);
            --bg-card: linear-gradient(145deg, #161e2d 0%, #1c2539 100%);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg);
            color: var(--text); margin: 0; padding: 20px; min-height: 100vh;
        }

        .glass-header {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(22, 30, 45, 0.7); backdrop-filter: blur(10px);
            padding: 15px 25px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px;
        }

        .btn-action {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white;
            padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700;
            font-size: 0.75rem; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .btn-neon-green { background: var(--green); color: #000; border: none; }
        .btn-neon-green:hover { box-shadow: 0 0 15px var(--green); transform: translateY(-2px); }

        .editor-container { display: grid; grid-template-columns: 380px 1fr; gap: 20px; }

        .control-panel {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px; height: fit-content;
        }

        .section-title { font-size: 0.8rem; color: var(--accent); font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.7rem; color: var(--dim); }
        .form-group input, .form-group textarea, .form-group select {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; outline: none;
        }

        .tag-chip {
            background: rgba(0,242,254,0.1); border: 1px solid var(--accent); color: var(--accent);
            padding: 4px 8px; border-radius: 6px; font-size: 0.65rem; cursor: pointer; display: inline-block; margin: 2px;
        }
        .tag-chip:hover { background: var(--accent); color: #000; }

        /* Vista Previa del Documento (A4) */
        .preview-stage {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 16px;
            padding: 30px; display: flex; justify-content: center; overflow-y: auto;
        }

        .document-paper {
            background: #ffffff; color: #000000; width: 100%; max-width: 650px; min-height: 840px;
            padding: 40px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; justify-content: space-between; font-family: 'Times New Roman', serif;
        }

        .doc-header-logos { display: flex; justify-content: space-between; align-items: center; min-height: 60px; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        .doc-header-logos img { max-height: 50px; max-width: 120px; object-fit: contain; }

        .doc-leyenda { font-size: 0.65rem; text-align: center; color: #555; margin: 8px 0 20px 0; font-style: italic; }

        .doc-body { flex-grow: 1; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; }

        .doc-footer { border-top: 1px solid #ccc; padding-top: 10px; font-size: 0.65rem; text-align: center; color: #555; }
    </style>
</head>
<body>

<div class="glass-header">
    <div>
        <h1 style="margin:0; font-size:1.4rem">🎨 DESIGNER <span style="font-weight:100">PLANTILLAS</span></h1>
        <p style="margin:0; font-size:0.65rem; color:var(--dim)">DISEÑO Y PERSONALIZACIÓN DE FORMATOS OFICIALES 2026</p>
    </div>
    <div style="display:flex; gap:10px">
        <a href="csfcrear.html" class="btn-action"><i class="fas fa-arrow-left"></i> REGRESAR</a>
        <button onclick="guardarEnSupabase()" class="btn-action btn-neon-green"><i class="fas fa-cloud-upload-alt"></i> GUARDAR EN SUPABASE</button>
    </div>
</div>

<div class="editor-container">
    
    <!-- PANEL DE CONTROL -->
    <div class="control-panel">
        <div class="section-title"><i class="fas fa-sliders-h"></i> Configuración General</div>
        
        <div class="form-group">
            <label>Tipo de Documento</label>
            <select id="tipoDoc" onchange="cargarPlantillaBase()">
                <option value="solicitud">FORMATO DE SOLICITUD</option>
                <option value="respuesta">FORMATO DE RESPUESTA</option>
            </select>
        </div>

        <div class="section-title"><i class="fas fa-images"></i> Logotipos Institucionales</div>
        
        <div class="form-group">
            <label>Logo Izquierdo (Principal)</label>
            <input type="file" id="logoIzq" accept="image/*" onchange="previewImagen(this, 'img-izq')">
        </div>
        <div class="form-group">
            <label>Logo Centro (Escudo/Entidad)</label>
            <input type="file" id="logoCen" accept="image/*" onchange="previewImagen(this, 'img-cen')">
        </div>
        <div class="form-group">
            <label>Logo Derecho (Programa/Secundario)</label>
            <input type="file" id="logoDer" accept="image/*" onchange="previewImagen(this, 'img-der')">
        </div>

        <div class="section-title"><i class="fas fa-heading"></i> Encabezado y Pie</div>
        
        <div class="form-group">
            <label>Leyenda Institucional (Encabezado)</label>
            <input type="text" id="inputLeyenda" value='"2026, Año de la Transformación Digital y la Transparencia"' oninput="actualizarPreview()">
        </div>
        <div class="form-group">
            <label>Texto Pie de Página</label>
            <input type="text" id="inputPie" value="Dirección de Correspondencia y Gestión Institucional | Edificio Central 2026" oninput="actualizarPreview()">
        </div>

        <div class="section-title"><i class="fas fa-code"></i> Insertar Variables Dinámicas</div>
        <div>
            <span class="tag-chip" onclick="insertarTag('{csf_salida}')">{csf_salida}</span>
            <span class="tag-chip" onclick="insertarTag('{dirigido_a}')">{dirigido_a}</span>
            <span class="tag-chip" onclick="insertarTag('{dep_dirigi}')">{dep_dirigi}</span>
            <span class="tag-chip" onclick="insertarTag('{oficio_emisor}')">{oficio_emisor}</span>
            <span class="tag-chip" onclick="insertarTag('{OFA Entrada}')">{OFA Entrada}</span>
            <span class="tag-chip" onclick="insertarTag('{firmante}')">{firmante}</span>
            <span class="tag-chip" onclick="insertarTag('{asunto}')">{asunto}</span>
            <span class="tag-chip" onclick="insertarTag('{fecha}')">{fecha}</span>
        </div>

        <div class="form-group">
            <label>Cuerpo del Documento</label>
            <textarea id="cuerpoDoc" rows="12" oninput="actualizarPreview()"></textarea>
        </div>
    </div>

    <!-- VISTA PREVIA -->
    <div class="preview-stage">
        <div class="document-paper">
            <div>
                <div class="doc-header-logos">
                    <img id="img-izq" src="" style="display:none;">
                    <img id="img-cen" src="" style="display:none;">
                    <img id="img-der" src="" style="display:none;">
                </div>
                <div class="doc-leyenda" id="prev-leyenda"></div>
            </div>

            <div class="doc-body" id="prev-cuerpo"></div>

            <div class="doc-footer" id="prev-pie"></div>
        </div>
    </div>

</div>

<script>
    const plantillasBase = {
        solicitud: `FOLIO: CSF/{csf_salida}/2026\nASUNTO: Solicitud de Información / Gestión\nFECHA: {fecha}\n\n{dirigido_a}\n{dep_dirigi}\nPRESENTE.\n\nPor medio del presente conducto, me dirijo a usted de la manera más atenta para hacer de su conocimiento el asunto relativo a: {asunto}.\n\nAsimismo, hago referencia al oficio emisor número {oficio_emisor}, mediante el cual se le da seguimiento oportuno a los trámites correspondientes registrados bajo la entrada {OFA Entrada}.\n\nSin otro particular por el momento, aprovecho la ocasión para enviarle un cordial saludo.\n\n\nATENTAMENTE,\n\n__________________________________\n{firmante}\nCorrespondencia PRO`,
        respuesta: `FOLIO DE RESPUESTA: CSF/{csf_salida}/2026\nOFICIO DE SALIDA: {OFA Salida}\nFECHA DE EMISIÓN: {fecha}\n\n{dirigido_a}\n{dep_dirigi}\nPRESENTE.\n\nEn atención a su solicitud presentada mediante el oficio emisor {oficio_emisor} referente al expediente {OFA Entrada}, me permito dar respuesta formal a su petición referente a: {asunto}.\n\nSobre el particular, le informo que se han realizado las gestiones necesarias y se da por atendida su solicitud en los términos correspondientes de la normativa vigente.\n\nQuedo a su disposición para cualquier aclaración o duda al respecto.\n\n\nATENTAMENTE,\n\n__________________________________\n{firmante}\nCorrespondencia PRO`
    };

    function cargarPlantillaBase() {
        const tipo = document.getElementById('tipoDoc').value;
        document.getElementById('cuerpoDoc').value = plantillasBase[tipo];
        actualizarPreview();
    }

    function actualizarPreview() {
        document.getElementById('prev-leyenda').innerText = document.getElementById('inputLeyenda').value;
        document.getElementById('prev-cuerpo').innerText = document.getElementById('cuerpoDoc').value;
        document.getElementById('prev-pie').innerText = document.getElementById('inputPie').value;
    }

    function insertarTag(tag) {
        const txtArea = document.getElementById('cuerpoDoc');
        const start = txtArea.selectionStart;
        const end = txtArea.selectionEnd;
        const text = txtArea.value;
        txtArea.value = text.substring(0, start) + tag + text.substring(end);
        actualizarPreview();
    }

    function previewImagen(input, imgId) {
        const img = document.getElementById(imgId);
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { img.src = e.target.result; img.style.display = 'block'; };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function guardarEnSupabase() {
        alert("Integración lista para subir el documento procesado a Supabase Storage.");
    }

    // Inicializar
    cargarPlantillaBase();
</script>

</body>
</html>
